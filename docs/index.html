<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kit-cloud SoC — status</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--border:#30363d;--fg:#c9d1d9;--dim:#8b949e;--ok:#3fb950;--bad:#f85149;--acc:#58a6ff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;padding:24px;max-width:1080px;margin:auto}
  h1{font-size:18px;margin-bottom:4px}
  .sub{color:var(--dim);margin-bottom:20px;font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px}
  .card h2{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
  .big{font-size:26px;font-weight:600}
  .kpi-sub{color:var(--dim);font-size:12px;margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  td,th{padding:4px 8px;border-bottom:1px solid var(--border);text-align:left}
  th{color:var(--dim);font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .ok{color:var(--ok)} .bad{color:var(--bad)}
  .bars{display:flex;align-items:flex-end;gap:2px;height:70px;margin-top:8px}
  .bar{flex:1;background:var(--acc);border-radius:2px 2px 0 0;min-height:2px;position:relative}
  .bar span{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--dim);white-space:nowrap}
  .sec{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:16px}
  .sec h2{font-size:12px;color:var(--dim);margin-bottom:10px}
  .cmt{color:var(--dim);font-size:11px;max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sec{overflow-x:auto}
  table{min-width:480px}
  @media(max-width:600px){
    body{padding:12px}
    .big{font-size:22px}
    .grid{grid-template-columns:repeat(2,1fr);gap:8px}
    .bars{height:50px}
    .bar span{font-size:8px}
  }
  footer{color:var(--dim);font-size:11px;margin-top:24px;border-top:1px solid var(--border);padding-top:12px}
  a{color:var(--acc);text-decoration:none}
</style>
</head>
<body>
<h1>kit-cloud SoC</h1>
<div class="sub" id="gen">loading…</div>

<div class="grid" id="kpis"></div>

<div class="sec"><h2>Alerts / day (7d)</h2><div class="bars" id="days"></div><div style="height:18px"></div></div>

<div class="sec"><h2>Top attacker sources (7d)</h2><table id="src"></table></div>

<div class="sec"><h2>Latest MISP 1932 additions (14d)</h2><table id="misp"></table></div>

<div class="sec"><h2>Pipeline runs</h2><table id="runs"></table></div>

<footer>Generated from live SoC state (Wazuh Indexer · MISP 1932 · VT ledger · health-check). Attacker IPs only; no internal identifiers. <a href="https://misp.kit-ai.net/events/view/1932">MISP 1932</a></footer>

<script>
const defang = ip => ip.replace(/\./g, "[.]");
fetch("data.json").then(r=>r.json()).then(d=>{
  document.getElementById("gen").textContent = "generated " + d.generated + " · agents down: " + (d.health.agents_down||"none");

  const k = d.wazuh||{};
  const cards = [
    ["Wazuh alerts (7d)", (k.total_7d||0).toLocaleString(), (k.by_agent||[]).slice(0,3).map(a=>a[0]+" "+a[1].toLocaleString()).join(" · ")],
    ["MISP 1932 IOCs", (d.misp&&d.misp.total||0), (d.misp&&d.misp.cidrs||[]).length + " CIDR ranges"],
    ["VT comments posted", d.vt&&d.vt.posted_total||0, "community ledger"],
    ["Blocklist", d.blocklist_n||0, "soc_blocklist.txt"],
  ];
  document.getElementById("kpis").innerHTML = cards.map(c=>
    `<div class="card"><h2>${c[0]}</h2><div class="big">${c[1]}</div><div class="kpi-sub">${c[2]}</div></div>`).join("");

  const days=(k.by_day||[]); const mx=Math.max(...days.map(x=>x[1]),1);
  document.getElementById("days").innerHTML = days.map(x=>
    `<div class="bar" style="height:${Math.round(70*x[1]/mx)}%" title="${x[0]}: ${x[1]}"><span>${x[0].slice(5)}</span></div>`).join("");

  const src=(k.top_src||[]).slice(0,12);
  document.getElementById("src").innerHTML =
    "<tr><th>source ip</th><th class=num>alerts</th></tr>" +
    src.map(x=>`<tr><td>${defang(x[0])}</td><td class=num>${x[1].toLocaleString()}</td></tr>`).join("");

  const misp=(d.misp&&d.misp.recent_14d||[]).slice(0,15);
  document.getElementById("misp").innerHTML =
    "<tr><th>ip</th><th>added</th><th>context</th></tr>" +
    misp.map(a=>`<tr><td>${defang(a.ip)}</td><td>${a.date}</td><td class=cmt title="">${(a.comment||"").replace(/</g,"&lt;").slice(0,120)}</td></tr>`).join("");

  const runs=(d.runs||[]).slice(-15).reverse();
  document.getElementById("runs").innerHTML =
    "<tr><th>when (UTC)</th><th>status</th><th>note</th></tr>" +
    runs.map(r=>`<tr><td>${r.ts.replace("T"," ").replace("Z","")}</td><td class="${r.status==="ok"?"ok":"bad"}">${r.status.toUpperCase()}</td><td>${r.why.replace(/</g,"&lt;")}</td></tr>`).join("");
}).catch(e=>{document.getElementById("gen").textContent="failed to load data.json: "+e});
</script>
</body>
</html>
